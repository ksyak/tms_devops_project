# Шаблон конфигурации Alertmanager.
#
# Каталог deploy/secrets НЕ синхронизируется Argo CD — здесь лежат шаблоны,
# из которых bootstrap.sh собирает Secret'ы кластера. Токен бота подставляется
# из переменной окружения и в git не попадает.
#
# Плейсхолдеры: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, namespace]
  # Пауза перед первым уведомлением: гасит всплески при rolling update.
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # Критичное напоминает о себе чаще остальных.
    - matchers:
        - severity="critical"
      receiver: telegram
      repeat_interval: 30m

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: ${TELEGRAM_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |-
          <b>{{ .Status | toUpper }}</b> — {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
