# Выпуск сертификатов Let's Encrypt по HTTP-01: cert-manager создаёт
# временный Ingress с проверочным путём, поэтому домен должен резолвиться
# в адрес балансировщика.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
