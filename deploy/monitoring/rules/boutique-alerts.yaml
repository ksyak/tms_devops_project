# Доступность подов, доступность витрины, время ответа.
#
# Источники метрик выбраны по факту наличия. Приложение не отдаёт /metrics
# (в сервисы встроен OpenTelemetry), а ingress-nginx 1.15 больше не
# собирает подробные метрики запросов: остался только процессный счётчик
# без разбивки по кодам ответа и без гистограммы задержек. Поэтому
# доступность и задержка снимаются пробами blackbox exporter, а состояние
# подов берётся из kube-state-metrics.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: boutique-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: boutique.availability
      rules:
        - alert: BoutiquePodNotReady
          expr: kube_pod_status_ready{condition="true", namespace="boutique"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Под {{ $labels.pod }} не готов более 5 минут"
            description: >-
              Под {{ $labels.pod }} в namespace {{ $labels.namespace }}
              не переходит в Ready. Смотреть: kubectl -n boutique describe
              pod {{ $labels.pod }} и kubectl -n boutique logs {{ $labels.pod }}.

        - alert: BoutiqueFrontendDown
          # Проба идёт через Ingress Controller, то есть тем же путём, что
          # и пользовательский запрос: ошибка означает недоступность
          # витрины снаружи, а не только падение пода.
          expr: probe_success{service="boutique-frontend"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Витрина не отвечает"
            description: >-
              Проба {{ $labels.instance }} не возвращает 200 более двух
              минут. Обычная причина — упал или недоступен один из
              бэкендов. Смотреть: kubectl -n boutique get pods.

    - name: boutique.latency
      rules:
        - alert: BoutiqueHighLatency
          expr: probe_duration_seconds{service="boutique-frontend"} > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Витрина отвечает дольше секунды"
            description: >-
              Время ответа {{ $value | humanizeDuration }}. Проверить
              нагрузку и ресурсы подов: kubectl -n boutique top pods.
