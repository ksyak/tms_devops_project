{{- if and .Values.networkPolicies.create .Values.ingress .Values.ingress.create }}
# Политика frontend пропускает трафик только от loadgenerator, поэтому
# Ingress Controller из другого namespace до пода не доходит.
# NetworkPolicy складываются по объединению: открывается один порт.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.frontend.name }}-from-ingress-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Метка проставляется каждому namespace автоматически.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
{{- if and .Values.networkPolicies.create .Values.ingress .Values.ingress.tls .Values.ingress.tls.enabled }}
---
# Под для проверки HTTP-01 создаётся cert-manager динамически и не подпадает
# ни под одну именованную политику, поэтому его перекрывает deny-all.
# Без этого правила выпуск сертификата не проходит: nginx не может
# достучаться до solver'а.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http-solver
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - port: 8089
          protocol: TCP
{{- end }}
