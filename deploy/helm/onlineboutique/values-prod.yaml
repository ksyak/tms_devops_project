# Значения для prod, поверх values.yaml.
# images.tag правится пайплайном CD при merge в main.

images:
  # До первой сборки — публичные образы upstream, дальше Artifact Registry.
  repository: europe-central2-docker.pkg.dev/project-0a6c8877-b757-4d4f-982/boutique
  # Тег всегда явный, без :latest.
  tag: "bebadb833f966048d9afdae0421928c35caec96e"
# По одной политике на сервис. Применяются Dataplane V2.
networkPolicies:
  create: true
securityContext:
  enable: true
seccompProfile:
  enable: true
  type: RuntimeDefault
# Istio не используется.
sidecars:
  create: false
authorizationPolicies:
  create: false
# Метрики снимает Prometheus в кластере.
opentelemetryCollector:
  create: false
googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false
ingress:
  create: true
  className: nginx
frontend:
  # Снаружи стоит NGINX Ingress, второй балансировщик не нужен.
  externalService: false
# Источник синтетической нагрузки.
loadGenerator:
  create: true
cartDatabase:
  inClusterRedis:
    # В upstream emptyDir: корзина теряется при рестарте пода.
    persistence:
      enabled: true
      storageClassName: standard-rwo
      size: 8Gi
