# Значения для prod, поверх values.yaml.
# images.tag правится пайплайном CD при merge в main.

images:
  # До первой сборки — публичные образы upstream, дальше Artifact Registry.
  repository: europe-central2-docker.pkg.dev/project-0a6c8877-b757-4d4f-982/boutique
  # Тег всегда явный, без :latest.
  tag: "8c95f8f671b14d92c1da65e475db10032cb13ba9"
# По одной политике на сервис. Применяются Dataplane V2.
networkPolicies:
  create: true
securityContext:
  enable: true
seccompProfile:
  enable: true
  type: RuntimeDefault
# Istio не используется.
sidecars:
  create: false
authorizationPolicies:
  create: false
# Метрики снимает Prometheus в кластере.
opentelemetryCollector:
  create: false
googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false
ingress:
  create: true
  className: nginx
  # nip.io резолвит <адрес>.nip.io в сам адрес. Домена у стенда нет, а
  # Let's Encrypt требует имя: сертификат на IP не выдаётся.
  host: "34.118.124.170.nip.io"
  tls:
    enabled: true
    issuer: letsencrypt
    secretName: frontend-tls
frontend:
  # Снаружи стоит NGINX Ingress, второй балансировщик не нужен.
  externalService: false
# Источник синтетической нагрузки. Направлен через Ingress Controller,
# чтобы трафик шёл тем же путём, что у пользователя.
loadGenerator:
  create: true
  frontendAddr: "ingress-nginx-controller.ingress-nginx.svc.cluster.local:80"
cartDatabase:
  inClusterRedis:
    # В upstream emptyDir: корзина теряется при рестарте пода.
    persistence:
      enabled: true
      storageClassName: standard-rwo
      size: 8Gi
