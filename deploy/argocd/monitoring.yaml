# kube-prometheus-stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Версия зафиксирована для воспроизводимости.
    targetRevision: 89.2.0
    helm:
      releaseName: monitoring
      values: |
        prometheus:
          # Собственной аутентификации нет — закрыт basic auth.
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              nginx.ingress.kubernetes.io/auth-type: basic
              nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
              nginx.ingress.kubernetes.io/auth-realm: "Prometheus"
            hosts:
              - prometheus.34.118.124.170.nip.io
            paths:
              - /
            pathType: Prefix
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.34.118.124.170.nip.io
          prometheusSpec:
            # Иначе подхватываются только объекты этого же релиза.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Короткая история: кластер из трёх e2-standard-2.
            retention: 2d
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi

        alertmanager:
          # У Alertmanager нет собственной аутентификации, поэтому доступ
          # закрыт basic auth на уровне Ingress.
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              nginx.ingress.kubernetes.io/auth-type: basic
              nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
              nginx.ingress.kubernetes.io/auth-realm: "Alertmanager"
            hosts:
              - alertmanager.34.118.124.170.nip.io
            paths:
              - /
            pathType: Prefix
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.34.118.124.170.nip.io
          alertmanagerSpec:
            # Конфиг лежит в SealedSecret: он содержит токен бота,
            # inline в values его держать нельзя.
            useExistingSecret: true
            configSecret: alertmanager-boutique
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi

        grafana:
          # Пароль из SealedSecret вместо дефолтного prom-operator.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # У Grafana есть своя форма входа, второй слой не нужен.
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - grafana.34.118.124.170.nip.io
            path: /
            pathType: Prefix
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.34.118.124.170.nip.io
          defaultDashboardsTimezone: browser
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          sidecar:
            dashboards:
              enabled: true
              # Дашборды из ConfigMap с этой меткой.
              label: grafana_dashboard
              searchNamespace: ALL

        # Control plane и DNS в GKE управляются провайдером, метрики
        # по ожидаемым адресам недоступны.
        coreDns:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD стека превышают лимит kubectl-аннотации в 262144 байта.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
