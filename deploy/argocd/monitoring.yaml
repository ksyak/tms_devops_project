# kube-prometheus-stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Версия зафиксирована для воспроизводимости.
    targetRevision: 89.2.0
    helm:
      releaseName: monitoring
      values: |
        prometheus:
          prometheusSpec:
            # Иначе подхватываются только объекты этого же релиза.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Короткая история: кластер из трёх e2-standard-2.
            retention: 2d
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi

        grafana:
          # Пароль по умолчанию prom-operator, наружу не публикуется.
          defaultDashboardsTimezone: browser
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          sidecar:
            dashboards:
              enabled: true
              # Дашборды из ConfigMap с этой меткой.
              label: grafana_dashboard
              searchNamespace: ALL

        # Control plane в GKE управляется провайдером, метрики недоступны.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD стека превышают лимит kubectl-аннотации в 262144 байта.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
