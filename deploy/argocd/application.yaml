# Приложение Online Boutique.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
  finalizers:
    # Без финализатора удаление Application осиротит ресурсы.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ksyak/tms_devops_project.git
    targetRevision: main
    path: deploy/helm/onlineboutique
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # Имя хоста зависит от внешнего IP, который каждый цикл teardown ->
      # bootstrap выдаётся заново. Держать его в values-prod.yaml нельзя:
      # значение устареет. Подставляется скриптом из terraform output.
      parameters:
        - name: ingress.host
          value: ${INGRESS_HOST}

  destination:
    server: https://kubernetes.default.svc
    namespace: boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
