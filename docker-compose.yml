# Локальный запуск без Kubernetes.
#
#   docker compose up -d
#   curl -f http://localhost:8080/_healthz
#
# По умолчанию берутся опубликованные образы; сборка из исходников —
# раскомментировать build у нужного сервиса. REGISTRY и TAG переопределяются
# через окружение.
#
# Адреса сервисов отличаются от манифестов Kubernetes: там emailservice:5000
# и frontend:80 — порты Service, здесь контейнеры общаются напрямую.

services:
  frontend:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/frontend:${TAG:-v0.10.6}
    # build: ./src/frontend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      ENABLE_PROFILER: "0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/_healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice

  productcatalogservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/productcatalogservice:${TAG:-v0.10.6}
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"

  currencyservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/currencyservice:${TAG:-v0.10.6}
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"

  cartservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/cartservice:${TAG:-v0.10.6}
    environment:
      REDIS_ADDR: redis-cart:6379
    depends_on:
      redis-cart:
        condition: service_healthy

  recommendationservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/recommendationservice:${TAG:-v0.10.6}
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
    depends_on:
      - productcatalogservice

  shippingservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/shippingservice:${TAG:-v0.10.6}
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  paymentservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/paymentservice:${TAG:-v0.10.6}
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  emailservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/emailservice:${TAG:-v0.10.6}
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"

  checkoutservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/checkoutservice:${TAG:-v0.10.6}
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice

  adservice:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/adservice:${TAG:-v0.10.6}
    environment:
      PORT: "9555"

  redis-cart:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  loadgenerator:
    image: ${REGISTRY:-us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo}/loadgenerator:${TAG:-v0.10.6}
    environment:
      FRONTEND_ADDR: frontend:8080
      USERS: "10"
      RATE: "1"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  redis-data:
